# Nginx edge configuration for ETIP.
# Terminates TLS (certs mounted by the platform), serves the built SPA,
# and reverse-proxies the API. Security headers are applied at the edge.

upstream etip_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production.
    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers (belt-and-braces with the app middleware).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    client_max_body_size 25m;

    # API
    location /api/ {
        proxy_pass         http://etip_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # Swagger / OpenAPI
    location ~ ^/(docs|redoc)$ { proxy_pass http://etip_api; }

    # Single-page app (built assets mounted here).
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
}
