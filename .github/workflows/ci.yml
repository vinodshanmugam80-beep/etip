name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etip
          POSTGRES_PASSWORD: etip
          POSTGRES_DB: etip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etip"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-secret-key-32-bytes-long-xxxxxx
      DATABASE_URL: postgresql+psycopg://etip:etip@localhost:5432/etip_test
      # Run the full test suite against PostgreSQL (not just SQLite).
      TEST_DATABASE_URL: postgresql+psycopg://etip:etip@localhost:5432/etip_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type check
        run: mypy app

      - name: Migrations apply on a clean database
        run: alembic upgrade head

      - name: Tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  build-image:
    needs: quality-and-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t etip:${{ github.sha }} .
